name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_pypi:
        description: "Publish to TestPyPI instead of PyPI"
        type: boolean
        default: false

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + release deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build and verify distributions
        run: |
          python scripts/check_release_artifacts.py --run-sdist-tests --run-examples

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to ${{ inputs.test_pypi && 'TestPyPI' || 'PyPI' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.test_pypi && 'testpypi' || 'pypi' }}
      url: ${{ inputs.test_pypi && 'https://test.pypi.org/p/agent-memory-contracts' || 'https://pypi.org/p/agent-memory-contracts' }}
    permissions:
      id-token: write  # required for PyPI trusted publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        if: ${{ inputs.test_pypi }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: ${{ !inputs.test_pypi }}
        uses: pypa/gh-action-pypi-publish@release/v1
